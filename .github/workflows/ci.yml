name: CI

# Runs on every push/PR to main. No Azure credentials and no spend possible: make test runs
# entirely against FakeTransport/FakeRealtimeServer, and make lint's checks are all static --
# including, as of Phase 7, a local `az bicep build` compile of every infra/modules/*.bicep file,
# which needs no `az login` and touches no live resource (docs/PLAN.md "Verification": "make test
# runs L0+L1+L2 with zero Azure dependency ... CI static check enforces B3's allowlist across the
# tree"). GitHub's ubuntu-latest runners ship Azure CLI preinstalled; `az bicep build` auto-installs
# the Bicep tooling on first use, same as verified locally 2026-09-16.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  test:
    name: Lint + test (zero Azure dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: voice-agent/pyproject.toml

      - name: make lint (ruff + mypy + B3 static allowlist check)
        run: make lint

      - name: make test (L0+L1+L2, no Azure dependency)
        run: make test
